services:
  - type: web
    name: linkedin-profile-api
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: API_KEYS
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: PROFILE_PROVIDER
        value: mock
